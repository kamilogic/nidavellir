[package]
name = "nidavellir-service"
version = "0.8.1"
description = "Nidavellir Core Service — privileged hardware access"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nidavellir-service"
path = "src/main.rs"

[dependencies]
nidavellir-core = { workspace = true }
nidavellir-gpu-stress = { path = "../gpu-stress" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Error reports scrub user folders, the computer name and GPU IDs (already in the lock via tooling).
regex = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows-service = "0.7"

[target.'cfg(windows)'.dependencies]
nidavellir-gpu-nvapi = { path = "../gpu-nvapi" }
# The Core sends the error reports itself, with the program's former HTTPS stack (already in the
# lock): rustls with ring, no new crates.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
